version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      workflow-dependencies:
        patterns: ["*"]
